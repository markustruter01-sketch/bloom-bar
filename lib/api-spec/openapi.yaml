openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Market history and schedule-linked planning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List market history
      responses:
        "200":
          description: Market history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"
  /markets/flower-prices:
    get:
      operationId: listFlowerPrices
      tags: [markets]
      summary: List reported flower price history
      description: Returns actual unit costs from completed Buy List Reports, grouped by flower.
      responses:
        "200":
          description: Reported flower price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerPriceHistory"
  /markets/context/{cycle}:
    get:
      operationId: getMarketContext
      tags: [markets]
      summary: Get the saved context for a scheduled market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      responses:
        "200":
          description: Schedule-linked market context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketContext"
  /markets/context/{cycle}/buy-items/{id}:
    patch:
      operationId: updateMarketBuyItem
      tags: [markets]
      summary: Update a buy-list item
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyItemUpdate"
      responses:
        "200":
          description: Updated buy-list item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyItem"
        "404":
          description: Buy-list item not found
  /markets/context/{cycle}/buy-list:
    patch:
      operationId: updateMarketBuyList
      tags: [markets]
      summary: Lock or unlock the proposed buy list
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyListLockUpdate"
      responses:
        "200":
          description: Updated buy-list state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBuyListState"
  /markets/context/{cycle}/actual-purchases:
    put:
      operationId: replaceMarketActualPurchases
      tags: [markets]
      summary: Save actual purchases and receipt analysis for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualPurchasesUpdate"
      responses:
        "200":
          description: Saved actual purchases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualPurchasesResponse"
  /markets/context/{cycle}/costs:
    put:
      operationId: replaceMarketCosts
      tags: [markets]
      summary: Save non-flower costs for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketCostsUpdate"
      responses:
        "200":
          description: Saved non-flower costs and recalculated market totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCostsResponse"
  /markets/context/{cycle}/report-purchases:
    post:
      operationId: reportMarketPurchases
      tags: [markets]
      summary: Report completed actual purchases for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      responses:
        "200":
          description: Reported purchase state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBuyListState"
        "400":
          description: The list is not locked or has no actual purchases
  /markets/context/{cycle}/bouquet-plan:
    patch:
      operationId: updateMarketBouquetPlan
      tags: [markets]
      summary: Save the bouquet plan for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BouquetPlanUpdate"
      responses:
        "200":
          description: Updated bouquet plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BouquetPlan"
  /markets/context/{cycle}/close:
    patch:
      operationId: updateMarketClose
      tags: [markets]
      summary: Save close-market counts for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseMarketUpdate"
      responses:
        "200":
          description: Updated close-market record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseMarket"
components:
  parameters:
    MarketCycle:
      name: cycle
      in: path
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Market:
      type: object
      required: [id, cycle, date, venue, spend, revenue, margin]
      properties:
        id:
          type: number
        cycle:
          type: number
        date:
          type: string
        venue:
          type: string
        spend:
          type: number
        revenue:
          type: number
        margin:
          type: number
    BuyItem:
      type: object
      required: [id, marketCycle, flower, detail, qty, unit, lastPrice, checked, category]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        flower:
          type: string
        detail:
          type: string
        qty:
          type: number
        unit:
          type: string
        lastPrice:
          type: number
        checked:
          type: boolean
        category:
          type: string
    BuyItemUpdate:
      type: object
      required: [checked]
      properties:
        checked:
          type: boolean
    BuyListLockUpdate:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
    ReceiptCandidate:
      type: object
      required: [flower, stems, unitCost, confidence, rawLine]
      properties:
        flower:
          type: string
        stems:
          type: number
          minimum: 0
        unitCost:
          type: number
          minimum: 0
        confidence:
          type: string
          enum: [high, medium, low]
        rawLine:
          type: string
    MarketBuyListState:
      type: object
      required: [marketCycle, locked, reported, receiptFileName, receiptText, receiptCandidates]
      properties:
        marketCycle:
          type: number
        locked:
          type: boolean
        reported:
          type: boolean
        receiptFileName:
          type: string
          nullable: true
        receiptText:
          type: string
          nullable: true
        receiptCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptCandidate"
    ActualPurchase:
      type: object
      required: [id, marketCycle, flower, detail, category, stems, unitCost, source]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        flower:
          type: string
        detail:
          type: string
        category:
          type: string
        stems:
          type: number
          minimum: 0
        unitCost:
          type: number
          minimum: 0
        source:
          type: string
          enum: [manual, receipt]
    ActualPurchaseInput:
      type: object
      required: [flower, detail, category, stems, unitCost, source]
      properties:
        flower:
          type: string
        detail:
          type: string
        category:
          type: string
        stems:
          type: number
          minimum: 0
        unitCost:
          type: number
          minimum: 0
        source:
          type: string
          enum: [manual, receipt]
    ActualPurchasesUpdate:
      type: object
      required: [purchases]
      properties:
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/ActualPurchaseInput"
        receiptFileName:
          type: string
          nullable: true
        receiptText:
          type: string
          nullable: true
        receiptCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptCandidate"
    ActualPurchasesResponse:
      type: object
      required: [buyList, purchases]
      properties:
        buyList:
          $ref: "#/components/schemas/MarketBuyListState"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/ActualPurchase"
    MarketCost:
      type: object
      required: [id, marketCycle, description, amount]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        description:
          type: string
        amount:
          type: number
          minimum: 0
    MarketCostInput:
      type: object
      required: [description, amount]
      properties:
        description:
          type: string
        amount:
          type: number
          minimum: 0
    MarketCostsUpdate:
      type: object
      required: [costs]
      properties:
        costs:
          type: array
          items:
            $ref: "#/components/schemas/MarketCostInput"
    MarketCostsResponse:
      type: object
      required: [costs, spend, margin]
      properties:
        costs:
          type: array
          items:
            $ref: "#/components/schemas/MarketCost"
        spend:
          type: number
        margin:
          type: number
    FlowerPricePoint:
      type: object
      required: [marketCycle, date, unitCost]
      properties:
        marketCycle:
          type: number
        date:
          type: string
        unitCost:
          type: number
          minimum: 0
    FlowerPriceHistory:
      type: object
      required: [flower, category, latest, previous, change, changePercent, history]
      properties:
        flower:
          type: string
        category:
          type: string
        latest:
          $ref: "#/components/schemas/FlowerPricePoint"
        previous:
          anyOf:
            - $ref: "#/components/schemas/FlowerPricePoint"
            - type: "null"
        change:
          type: number
          nullable: true
        changePercent:
          type: number
          nullable: true
        history:
          type: array
          items:
            $ref: "#/components/schemas/FlowerPricePoint"
    BouquetPlan:
      type: object
      required: [marketCycle, selectedBand, count]
      properties:
        marketCycle:
          type: number
        selectedBand:
          type: string
        count:
          type: number
    BouquetPlanUpdate:
      type: object
      required: [selectedBand, count]
      properties:
        selectedBand:
          type: string
        count:
          type: number
          minimum: 0
    CloseMarket:
      type: object
      required: [marketCycle, counts, sellThrough, closed]
      properties:
        marketCycle:
          type: number
        counts:
          type: object
          additionalProperties:
            type: number
            minimum: 0
        sellThrough:
          type: array
          items:
            $ref: "#/components/schemas/SellThroughRecord"
        closed:
          type: boolean
    SellThroughRecord:
      type: object
      required: [flower, purchasedStems, leftoverStems, soldStems, sellThroughPercent]
      properties:
        flower:
          type: string
        purchasedStems:
          type: number
          minimum: 0
        leftoverStems:
          type: number
          minimum: 0
        soldStems:
          type: number
          minimum: 0
        sellThroughPercent:
          type: number
          minimum: 0
          maximum: 100
    CloseMarketUpdate:
      type: object
      required: [counts, closed]
      properties:
        counts:
          type: object
          additionalProperties:
            type: number
            minimum: 0
        closed:
          type: boolean
    MarketContext:
      type: object
      required: [cycle, date, venue, spend, revenue, margin, buyItems, buyList, actualPurchases, costs, bouquetPlan, closeMarket]
      properties:
        cycle:
          type: number
        date:
          type: string
        venue:
          type: string
        spend:
          type: number
        revenue:
          type: number
        margin:
          type: number
        buyItems:
          type: array
          items:
            $ref: "#/components/schemas/BuyItem"
        buyList:
          $ref: "#/components/schemas/MarketBuyListState"
        actualPurchases:
          type: array
          items:
            $ref: "#/components/schemas/ActualPurchase"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/MarketCost"
        bouquetPlan:
          $ref: "#/components/schemas/BouquetPlan"
        closeMarket:
          $ref: "#/components/schemas/CloseMarket"

