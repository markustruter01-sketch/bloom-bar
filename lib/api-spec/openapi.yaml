    MarketContext:
      type: object
      required: [cycle, date, venue, spend, revenue, margin, buyItems, buyList, actualPurchases, costs, bouquetPlan, closeMarket]
      properties:
        cycle:
          type: number
        date:
          type: string
        venue:
          type: string
        spend:
          type: number
        revenue:
          type: number
        margin:
          type: number
        buyItems:
          type: array
          items:
            $ref: "#/components/schemas/BuyItem"
        buyList:
          $ref: "#/components/schemas/MarketBuyListState"
        actualPurchases:
          type: array
          items:
            $ref: "#/components/schemas/ActualPurchase"
        costs:
          type: array
          items:
            $ref: "#/components/schemas/MarketCost"
        bouquetPlan:
          $ref: "#/components/schemas/BouquetPlan"
        closeMarket:
          $ref: "#/components/schemas/CloseMarket"

