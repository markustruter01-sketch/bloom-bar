openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markets
    description: Market history and schedule-linked planning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /markets:
    get:
      operationId: listMarkets
      tags: [markets]
      summary: List market history
      responses:
        "200":
          description: Market history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Market"
  /markets/schedule/overrides:
    get:
      operationId: listMarketScheduleOverrides
      tags: [markets]
      summary: List market schedule overrides
      responses:
        "200":
          description: Saved skipped and rescheduled market dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketScheduleOverride"
  /markets/schedule/overrides/{cycle}:
    put:
      operationId: upsertMarketScheduleOverride
      tags: [markets]
      summary: Skip or reschedule a calculated market date
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketScheduleOverrideUpdate"
      responses:
        "200":
          description: Saved market schedule override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketScheduleOverride"
        "400":
          description: Invalid market cycle or rescheduled date
    delete:
      operationId: deleteMarketScheduleOverride
      tags: [markets]
      summary: Remove a market schedule override
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      responses:
        "204":
          description: Override removed
  /markets/sell-through:
    get:
      operationId: getSellThroughComparison
      tags: [markets]
      summary: Compare sell-through across completed market cycles
      parameters:
        - name: cycles
          in: query
          required: true
          description: Completed market cycles to compare
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: number
      responses:
        "200":
          description: Sell-through comparison scoped to the selected cycles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellThroughComparison"
        "400":
          description: The selection is empty or includes an incomplete market
  /markets/flower-prices:
    get:
      operationId: listFlowerPrices
      tags: [markets]
      summary: List reported flower price history
      description: Returns actual unit costs from completed Buy List Reports, grouped by flower.
      responses:
        "200":
          description: Reported flower price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerPriceHistory"
  /markets/flower-care:
    get:
      operationId: listFlowerCare
      tags: [markets]
      summary: List care guidance for every purchased flower
      description: Returns one editable care entry for each flower found in actual purchase history.
      responses:
        "200":
          description: Purchased flower care entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerCareEntry"
  /markets/flower-care/{flower}:
    put:
      operationId: updateFlowerCare
      tags: [markets]
      summary: Edit care guidance for a purchased flower
      parameters:
        - name: flower
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowerCareUpdate"
      responses:
        "200":
          description: Updated flower care entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowerCareEntry"
        "404":
          description: Flower is not present in actual purchase history
  /markets/flower-knowledge:
    get:
      operationId: listFlowerKnowledge
      tags: [markets]
      summary: List knowledge for every purchased flower
      description: Returns nine editable, source-labelled knowledge sections for each flower found in actual purchase history.
      responses:
        "200":
          description: Purchased flower knowledge entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerKnowledgeEntry"
  /markets/flower-knowledge/{flower}:
    put:
      operationId: updateFlowerKnowledge
      tags: [markets]
      summary: Edit knowledge sections for a purchased flower
      parameters:
        - name: flower
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowerKnowledgeUpdate"
      responses:
        "200":
          description: Updated flower knowledge entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowerKnowledgeEntry"
        "404":
          description: Flower is not present in actual purchase history
  /markets/flower-price-tracker:
    get:
      operationId: listFlowerPriceTracker
      tags: [markets]
      summary: List reported purchase line-items by market date
      description: Returns the finalized bunch-based purchase rows grouped by reported market date.
      responses:
        "200":
          description: Reported purchase line-items grouped by market date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerPriceTrackerMarket"
  /markets/flower-price-dashboard:
    get:
      operationId: listFlowerPriceDashboard
      tags: [markets]
      summary: List flower price observations for the tracker dashboard
      description: Returns reported market purchase observations and manually backfilled historical observations.
      responses:
        "200":
          description: Flower price dashboard observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowerPriceDashboardResponse"
  /markets/flower-price-receipts:
    get:
      operationId: listFlowerPriceReceipts
      tags: [markets]
      summary: List receipt line items in the flower price tracker
      responses:
        "200":
          description: Flower purchase receipts, grouped with their line items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerPriceReceipt"
    post:
      operationId: createFlowerPriceReceipts
      tags: [markets]
      summary: Import flower purchase receipts without duplicating existing lines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowerPriceReceiptsInput"
      responses:
        "201":
          description: Receipt import results and current receipt records
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/FlowerPriceReceiptImportResult"
        "400":
          description: Invalid receipt data
  /markets/flower-price-receipt-lines/{lineId}:
    patch:
      operationId: updateFlowerPriceReceiptLineStemCount
      tags: [markets]
      summary: Save a manual stem count for a receipt line
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowerPriceReceiptLineStemCountInput"
      responses:
        "200":
          description: Updated receipt line with calculated GST-inclusive total and cost per stem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowerPriceReceiptLine"
        "400":
          description: Invalid line ID or stem count
        "404":
          description: Receipt line was not found
  /markets/flower-price-flowers:
    get:
      operationId: listFlowerPriceTrackerFlowers
      tags: [markets]
      summary: List canonical flower groups and saved categories
      responses:
        "200":
          description: Flower names represented in the tracker and their saved category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowerPriceTrackerFlower"
    patch:
      operationId: updateFlowerPriceTrackerFlowerCategory
      tags: [markets]
      summary: Save a category for a canonical flower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlowerPriceTrackerFlowerCategoryInput"
      responses:
        "200":
          description: Updated flower category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowerPriceTrackerFlower"
        "400":
          description: Invalid flower name or category
  /markets/flower-price-backfills:
    post:
      operationId: createFlowerPriceBackfill
      tags: [markets]
      summary: Add a historical flower purchase record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowerPriceBackfillInput"
      responses:
        "201":
          description: Historical flower purchase record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowerPriceDashboardObservation"
        "400":
          description: Invalid historical purchase data
  /markets/non-flower-purchases:
    get:
      operationId: listNonFlowerPurchases
      tags: [markets]
      summary: List non-flower purchases by market fortnight
      description: Returns manually entered non-flower business purchases grouped by the canonical market schedule.
      responses:
        "200":
          description: Non-flower purchases grouped by market fortnight
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NonFlowerPurchasePeriod"
  /markets/non-flower-purchases/{cycle}:
    put:
      operationId: replaceNonFlowerPurchases
      tags: [markets]
      summary: Replace non-flower purchases for a market fortnight
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NonFlowerPurchasesUpdate"
      responses:
        "200":
          description: Saved non-flower purchases for the fortnight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonFlowerPurchasePeriod"
        "400":
          description: Invalid non-flower purchase data
  /markets/non-flower-purchases/{cycle}/imports:
    post:
      operationId: importNonFlowerBankFile
      tags: [markets]
      summary: Import parsed bank purchase lines for a market fortnight
      description: Stores parsed bank lines without retaining the uploaded file. Re-uploading the same file for the same fortnight returns the existing import instead of duplicating it.
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NonFlowerBankImportInput"
      responses:
        "200":
          description: Imported bank lines or an existing import when the file was already uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonFlowerBankImportUploadResponse"
        "400":
          description: Invalid bank import data
  /markets/non-flower-imports/{importId}:
    put:
      operationId: replaceNonFlowerBankImportDetails
      tags: [markets]
      summary: Replace detail rows for imported bank lines
      description: Saves manual sub-entries while preserving the original bank line amount for reconciliation.
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NonFlowerBankImportDetailsUpdate"
      responses:
        "200":
          description: Updated imported bank lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NonFlowerBankImport"
        "400":
          description: Invalid import detail data
  /markets/context/{cycle}:
    get:
      operationId: getMarketContext
      tags: [markets]
      summary: Get the saved context for a scheduled market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      responses:
        "200":
          description: Schedule-linked market context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketContext"
  /markets/context/{cycle}/buy-items/{id}:
    patch:
      operationId: updateMarketBuyItem
      tags: [markets]
      summary: Update a buy-list item
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyItemUpdate"
      responses:
        "200":
          description: Updated buy-list item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuyItem"
        "404":
          description: Buy-list item not found
  /markets/context/{cycle}/buy-list:
    patch:
      operationId: updateMarketBuyList
      tags: [markets]
      summary: Lock or unlock the proposed buy list
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyListLockUpdate"
      responses:
        "200":
          description: Updated buy-list state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBuyListState"
  /markets/context/{cycle}/actual-purchases:
    put:
      operationId: replaceMarketActualPurchases
      tags: [markets]
      summary: Save actual purchases for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActualPurchasesUpdate"
      responses:
        "200":
          description: Saved actual purchases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActualPurchasesResponse"
  /markets/context/{cycle}/costs:
    put:
      operationId: replaceMarketCosts
      tags: [markets]
      summary: Save non-flower costs for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketCostsUpdate"
      responses:
        "200":
          description: Saved non-flower costs and recalculated market totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketCostsResponse"
  /markets/context/{cycle}/report-purchases:
    post:
      operationId: reportMarketPurchases
      tags: [markets]
      summary: Report completed actual purchases for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      responses:
        "200":
          description: Reported purchase state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketBuyListState"
        "400":
          description: The list is not locked or has no actual purchases
  /markets/context/{cycle}/bouquet-plan:
    patch:
      operationId: updateMarketBouquetPlan
      tags: [markets]
      summary: Save the bouquet plan for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BouquetPlanUpdate"
      responses:
        "200":
          description: Updated bouquet plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BouquetPlan"
  /markets/context/{cycle}/close:
    patch:
      operationId: updateMarketClose
      tags: [markets]
      summary: Save or intentionally reopen close-market counts for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseMarketUpdate"
      responses:
        "200":
          description: Updated close-market record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseMarket"
        "409":
          description: The close-market record is finalized and must be intentionally reopened before editing
  /markets/day-todos:
    get:
      operationId: listMarketDayTodos
      tags: [markets]
      summary: List Market Day To Do items by market cycle
      responses:
        "200":
          description: To-do lists and immutable close snapshots grouped by market cycle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketDayTodoPeriod"
  /markets/day-todos/{cycle}:
    put:
      operationId: replaceMarketDayTodos
      tags: [markets]
      summary: Replace Market Day To Do items for a market cycle
      parameters:
        - $ref: "#/components/parameters/MarketCycle"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDayTodosUpdate"
      responses:
        "200":
          description: Saved Market Day To Do list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDayTodoPeriod"
        "400":
          description: Invalid Market Day To Do data
components:
  parameters:
    MarketCycle:
      name: cycle
      in: path
      required: true
      schema:
        type: number
  schemas:
    FlowerCategory:
      type: string
      enum:
        - Gum
        - Textural Foliage
        - Classic Blooms
        - Statement Blooms
        - Premium Natives
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Market:
      type: object
      required: [id, cycle, date, venue, flowerSpend, costs, spend, revenue, margin, closed]
      properties:
        id:
          type: number
        cycle:
          type: number
        date:
          type: string
        venue:
          type: string
        flowerSpend:
          type: number
          minimum: 0
        costs:
          type: array
          items:
            $ref: "#/components/schemas/MarketCost"
        spend:
          type: number
        revenue:
          type: number
        margin:
          type: number
        closed:
          type: boolean
    MarketScheduleOverride:
      type: object
      required: [marketCycle, status, rescheduledDate]
      properties:
        marketCycle:
          type: number
        status:
          type: string
          enum: [skipped, rescheduled]
        rescheduledDate:
          type: string
          nullable: true
    MarketScheduleOverrideUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [skipped, rescheduled]
        rescheduledDate:
          type: string
          nullable: true
    BuyItemPriceSource:
      type: object
      required: [kind, marketCycle, date]
      properties:
        kind:
          type: string
          enum: [reported, fallback]
        marketCycle:
          type: number
          nullable: true
        date:
          type: string
          nullable: true
    BuyItem:
      type: object
      required: [id, marketCycle, flower, detail, qty, unit, lastPrice, checked, category, priceSource]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        flower:
          type: string
        detail:
          type: string
        qty:
          type: number
        unit:
          type: string
        lastPrice:
          type: number
        checked:
          type: boolean
        category:
          $ref: "#/components/schemas/FlowerCategory"
        priceSource:
          $ref: "#/components/schemas/BuyItemPriceSource"
    BuyItemUpdate:
      type: object
      required: [checked]
      properties:
        checked:
          type: boolean
    BuyListLockUpdate:
      type: object
      required: [locked]
      properties:
        locked:
          type: boolean
    ReceiptCandidate:
      type: object
      required: [flower, stems, unitCost, confidence, rawLine]
      properties:
        flower:
          type: string
        stems:
          type: number
          minimum: 0
        unitCost:
          type: number
          minimum: 0
        bunchSize:
          type: number
          minimum: 1
          description: Best-effort stems per bunch used for the bunch purchase draft
        bunchesPurchased:
          type: number
          minimum: 1
          description: Best-effort bunch count read from the receipt
        pricePerBunch:
          type: number
          minimum: 0
          description: Best-effort AUD price for one bunch
        supplier:
          type: string
          nullable: true
          description: Best-effort supplier or wholesaler name
        confidence:
          type: string
          enum: [high, medium, low]
        rawLine:
          type: string
    MarketBuyListState:
      type: object
      required: [marketCycle, locked, reported, receiptFileName, receiptText, receiptCandidates, editLog]
      properties:
        marketCycle:
          type: number
        locked:
          type: boolean
        reported:
          type: boolean
        receiptFileName:
          type: string
          nullable: true
        receiptText:
          type: string
          nullable: true
        receiptCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptCandidate"
        editLog:
          type: array
          items:
            $ref: "#/components/schemas/MarketBuyListEditLog"
    MarketBuyListEditLog:
      type: object
      required: [id, marketCycle, action, summary, createdAt]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        action:
          type: string
          enum: [unlocked, item_updated, relocked]
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
    ActualPurchase:
      type: object
      required: [id, marketCycle, flower, detail, category, bunchSize, bunchesPurchased, pricePerBunch, supplier, totalStemQty, costPerStem, source, stems, unitCost]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        flower:
          type: string
        detail:
          type: string
        category:
          $ref: "#/components/schemas/FlowerCategory"
        bunchSize:
          type: number
          minimum: 1
          description: Stems contained in one purchased bunch
        bunchesPurchased:
          type: number
          minimum: 1
          description: Number of bunches purchased on this line
        pricePerBunch:
          type: number
          minimum: 0
          description: AUD price for one bunch
        supplier:
          type: string
          nullable: true
          description: Optional wholesaler or supplier name
        totalStemQty:
          type: number
          minimum: 0
          description: Calculated as bunchSize multiplied by bunchesPurchased
        costPerStem:
          type: number
          minimum: 0
          description: Calculated as pricePerBunch divided by bunchSize
        stems:
          type: number
          minimum: 0
          deprecated: true
          description: Compatibility alias for totalStemQty
        unitCost:
          type: number
          minimum: 0
          deprecated: true
          description: Compatibility alias for costPerStem
        source:
          type: string
          enum: [manual, receipt]
    BunchPurchaseInput:
      type: object
      required: [flower, detail, category, bunchSize, bunchesPurchased, pricePerBunch, source]
      properties:
        flower:
          type: string
        detail:
          type: string
        category:
          $ref: "#/components/schemas/FlowerCategory"
        bunchSize:
          type: number
          minimum: 1
          description: Stems contained in one purchased bunch
        bunchesPurchased:
          type: number
          minimum: 1
          description: Number of bunches purchased on this line
        pricePerBunch:
          type: number
          minimum: 0
          description: AUD price for one bunch
        supplier:
          type: string
          nullable: true
          description: Optional wholesaler or supplier name
        source:
          type: string
          enum: [manual, receipt]
    LegacyActualPurchaseInput:
      type: object
      required: [flower, detail, category, stems, unitCost, source]
      description: Temporary compatibility shape. It is normalized to one-stem bunches before storage.
      properties:
        flower:
          type: string
        detail:
          type: string
        category:
          $ref: "#/components/schemas/FlowerCategory"
        stems:
          type: number
          minimum: 1
        unitCost:
          type: number
          minimum: 0
        source:
          type: string
          enum: [manual, receipt]
    ActualPurchaseInput:
      oneOf:
        - $ref: "#/components/schemas/BunchPurchaseInput"
        - $ref: "#/components/schemas/LegacyActualPurchaseInput"
    ActualPurchasesUpdate:
      type: object
      required: [purchases]
      properties:
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/ActualPurchaseInput"
        receiptFileName:
          type: string
          nullable: true
        receiptText:
          type: string
          nullable: true
        receiptCandidates:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptCandidate"
    ActualPurchasesResponse:
      type: object
      required: [buyList, purchases]
      properties:
        buyList:
          $ref: "#/components/schemas/MarketBuyListState"
        purchases:
          type: array
          items:
            $ref: "#/components/schemas/ActualPurchase"
    MarketCost:
      type: object
      required: [id, marketCycle, description, amount]
      properties:
        id:
          type: number
        marketCycle:
          type: number
        description:
          type: string
        amount:
